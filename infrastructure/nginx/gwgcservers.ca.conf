# ==============================================================================
# GreenWave Infrastructure Management Console - NGINX Gateway
# Host: loadbalancer-1 (192.168.1.11) & loadbalancer-2 (192.168.1.24)
# Domain: gwgcservers.ca / www.gwgcservers.ca
# ==============================================================================

# Upstream Management API
upstream management_api_upstream {
    server 192.168.1.15:3010 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gwgcservers.ca www.gwgcservers.ca;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gwgcservers.ca www.gwgcservers.ca;

    # SSL / TLS Settings
    ssl_certificate /etc/letsencrypt/live/gwgcservers.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gwgcservers.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://gwgcservers.ca;" always;

    root /var/www/gwgcservers.ca/dist;
    index index.html;

    # Real-Time SSE Telemetry Stream (Buffering DISABLED)
    location /api/v1/telemetry/stream {
        proxy_pass http://management_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE real-time events
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Management API Endpoints
    location /api/ {
        proxy_pass http://management_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # React Single Page Application Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
