# ==============================================================================
# GreenWave Main Web Application - NGINX Gateway
# Domain: app.gwgcservers.ca / gwgc.cloud
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.gwgcservers.ca gwgc.cloud www.gwgc.cloud;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.gwgcservers.ca gwgc.cloud www.gwgc.cloud;

    ssl_certificate /etc/letsencrypt/live/gwgc.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gwgc.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/greenwave-app/dist;
    index index.html;

    location /api/ {
        proxy_pass http://greenwave_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
