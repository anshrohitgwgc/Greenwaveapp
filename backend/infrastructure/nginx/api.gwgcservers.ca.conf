# ==============================================================================
# GreenWave Core API Cluster - Upstream Load Balancer
# Upstream Nodes: api-1 (192.168.1.12), api-2 (192.168.1.21), api-3 (192.168.1.31)
# ==============================================================================

upstream greenwave_api_cluster {
    least_conn;
    server 192.168.1.12:3000 max_fails=3 fail_timeout=10s;
    server 192.168.1.21:3000 max_fails=3 fail_timeout=10s;
    server 192.168.1.31:3000 backup;
    keepalive 64;
}

server {
    listen 80;
    server_name api.gwgcservers.ca api.gwgc.cloud;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.gwgcservers.ca api.gwgc.cloud;

    ssl_certificate /etc/letsencrypt/live/gwgcservers.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gwgcservers.ca/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://greenwave_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
