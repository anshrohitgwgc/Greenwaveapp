version: '3.8'

services:
  # 1. Local PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: greenwave-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-greenwave_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpass123}
      POSTGRES_DB: ${DB_DATABASE:-greenwave_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-greenwave_dev} -d ${DB_DATABASE:-greenwave_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local Redis 7
  redis:
    image: redis:7-alpine
    container_name: greenwave-local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Local MinIO S3 Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: greenwave-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Auto Bucket Creator for MinIO
  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb local/greenwave-photos --ignore-existing;
      /usr/bin/mc anonymous set download local/greenwave-photos;
      exit 0;
      "

  # 5. Local GreenWave NestJS API
  api:
    build:
      context: ../../app/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: greenwave-local-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-greenwave_dev}
      DB_PASSWORD: ${DB_PASSWORD:-localdevpass123}
      DB_DATABASE: ${DB_DATABASE:-greenwave_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: greenwave-photos
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-do-not-use-in-prod}
      JWT_EXPIRATION: 86400s
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../app/api/src:/usr/src/app/src:ro

  # 6. Local GreenWave Web Frontend
  web:
    build:
      context: ../../app/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: greenwave-local-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ../../app/web/src:/usr/src/app/src:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
